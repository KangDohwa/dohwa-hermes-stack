name: hermes-agent

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    image: "${HERMES_IMAGE:-dohwa-hermes-stack:local}"
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    working_dir: /workspace
    environment:
      HERMES_UID: "1001"
      HERMES_GID: "1001"
      TZ: Etc/UTC
    volumes:
      - ./data:/opt/data
      - ./workspace:/workspace
      - ./backups:/backups
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 512
    shm_size: 1gb
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
